name: Publicador Autonomo Diario (PB Ideas Virtuales)

on:
  push:
    branches:
      - main
  schedule:
    # 13:07 UTC = 10:07 AM hora Argentina (UTC-3), todos los dias
    - cron: '7 13 * * *'
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Forzar publicacion inmediata hoy aunque ya exista articulo del dia'
        required: false
        default: 'true'
        type: string

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-publisher"
  cancel-in-progress: false

jobs:
  publish_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cloud Editorial Publisher
        id: publish
        if: github.event_name != 'push'
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_PUBLISH: ${{ inputs.force_publish }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE_PUBLISH" = "true" ]; then
            python .github/editorial/publicar_desde_nube.py --force
          else
            python .github/editorial/publicar_desde_nube.py
          fi

      - name: Commit & Push New Daily Article
        if: github.event_name != 'push' && steps.publish.outputs.changed == 'true'
        env:
          PUB_TITLE: ${{ steps.publish.outputs.published_title }}
          STOCK_REM: ${{ steps.publish.outputs.remaining_count }}
        run: |
          git config user.name "PB Ideas Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Auto-publish: $PUB_TITLE [stock=$STOCK_REM]"
          git push

      - name: Stage Clean Public Static Site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r index.html sitemap.xml robots.txt app-ads.txt google*.html privacidad*.html *_blog _site/
          for f in BingSiteAuth.xml; do [ -f "$f" ] && cp "$f" _site/ || true; done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Manage Low-Stock Alert Issue
        uses: actions/github-script@v7
        env:
          EVENT_NAME: ${{ github.event_name }}
        with:
          script: |
            const fs = require('fs');
            const vault = JSON.parse(fs.readFileSync('.github/editorial/boveda_editorial.json', 'utf8'));
            const published = JSON.parse(fs.readFileSync('.github/editorial/articulos_publicados.json', 'utf8'));
            const pubSlugs = new Set(published.map(a => a.slug));
            const remaining = (vault.queue || []).filter(a => !pubSlugs.has(a.slug)).length;
            const criticalThreshold = Number(vault.critical_alert_threshold ?? 5);

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 20
            });
            const stockIssues = issues.filter(i => i.title.includes('[STOCK ALERT]'));

            if (process.env.EVENT_NAME !== 'push' && remaining <= criticalThreshold) {
              if (stockIssues.length === 0) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `[STOCK ALERT] Quedan solo ${remaining} articulos en la Boveda Editorial`,
                  body: `Alerta automatica del publicador en la nube:\n\nLa Boveda Editorial (\`.github/editorial/boveda_editorial.json\`) descendio a **${remaining} articulos restantes**.\n\nAbre Antigravity (o espera al proximo chequeo Lunes/Jueves 20:00 hs) para recargar 30 articulos nuevos.`
                });
              }
            } else if (remaining > criticalThreshold && stockIssues.length > 0) {
              for (const issue of stockIssues) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `Recarga detectada automaticamente. Stock actual disponible en la Boveda Editorial: **${remaining} articulos**. Se cierra la alerta.`
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
              }
            }
